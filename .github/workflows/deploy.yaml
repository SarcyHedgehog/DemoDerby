name: Deploy DemoDerby to sarcastichedgehog.com
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DemoDerby
        uses: actions/checkout@v4
        with:
          path: demoderby_game
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: SarcyHedgehog/sarcastichedgehog.com
          path: website_repo
          token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN }}
      - name: Replace deployed game with Photon build
        env:
          PHOTON_APP_ID: ${{ secrets.PHOTON_APP_ID }}
        run: |
          TARGET="./website_repo/demoderby"
          if [[ -z "$PHOTON_APP_ID" ]]; then
            echo "PHOTON_APP_ID repository secret is not configured."
            exit 1
          fi
          mkdir -p "$TARGET"
          rsync -av --delete \
            --include='/index.html' \
            --include='/styles.css' \
            --include='/fixes.css' \
            --include='/manifest.json' \
            --include='/icon.svg' \
            --include='/sw.js' \
            --include='/src/***' \
            --include='/assets/[1-8]car.png' \
            --include='/vendor/***' \
            --exclude='*' \
            ./demoderby_game/ "$TARGET/"
          printf '%s\n' \
            'window.APP_CONFIG = {' \
            "  PHOTON_APP_ID: \"$PHOTON_APP_ID\"," \
            '  PHOTON_REGION: "eu",' \
            '  PHOTON_SDK_URL: "vendor/photon.min.js",' \
            '  DEBUG: false,' \
            '};' > "$TARGET/config.js"
      - name: Commit website update
        run: |
          cd ./website_repo
          if [[ -n $(git status --porcelain) ]]; then
            git config user.name "GitHub Actions Bot"
            git config user.email "actions@github.com"
            git add demoderby
            git commit -m "Deploy DemoDerby update"
            git push origin main
          fi
